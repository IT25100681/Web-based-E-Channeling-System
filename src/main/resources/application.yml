spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  application:
    name: echanneling
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  open-browser-on-start: ${APP_OPEN_BROWSER_ON_START:true}
