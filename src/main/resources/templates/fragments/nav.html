<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-hospital-user text-primary me-2"></i>LankaCare E-Channeling
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-link navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/patient/appointments/search"><i class="fa-solid fa-magnifying-glass me-1"></i> Search Doctors</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('PATIENT')">
                    <a class="nav-link" href="/patient/dashboard"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('PATIENT')">
                    <a class="nav-link" href="/patient/appointments"><i class="fa-solid fa-calendar-check me-1"></i> My Appointments</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('PATIENT')">
                    <a class="nav-link" href="/medical-history"><i class="fa-solid fa-notes-medical me-1"></i> Medical History</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('DOCTOR')">
                    <a class="nav-link" href="/doctor/dashboard"><i class="fa-solid fa-user-doctor me-1"></i> Doctor Portal</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('DOCTOR')">
                    <a class="nav-link" href="/doctor/schedules"><i class="fa-solid fa-clock me-1"></i> Manage Schedules</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-1"></i> Admin Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/doctors"><i class="fa-solid fa-user-doctor me-1"></i> Manage Doctors</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/hospital-management"><i class="fa-solid fa-building-hospital me-1"></i> Hospitals & Depts</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/complaints"><i class="fa-solid fa-comments me-1"></i> Complaints</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/prescriptions"><i class="fa-solid fa-prescription-bottle-medical me-1"></i> Prescriptions</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-primary me-2" href="/login"><i class="fa-solid fa-right-to-bracket me-1"></i> Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-primary" href="/register"><i class="fa-solid fa-user-plus me-1"></i> Register</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle font-weight-bold" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-circle-user text-primary me-1"></i> <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
