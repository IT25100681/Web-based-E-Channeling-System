<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Create Channeling Schedule</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow">
                <h3 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-2"></i>New Channeling Schedule</h3>
                <form th:action="@{/doctor/schedules}" th:object="${scheduleForm}" method="post">
                    <input type="hidden" th:field="*{doctorId}">

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select th:field="*{departmentId}" class="form-select">
                            <option th:each="d : ${departments}" th:value="${d.departmentId}" th:text="${d.name}">Dept</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Schedule Date *</label>
                        <input type="date" th:field="*{scheduleDate}" class="form-control" required>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Start Time *</label>
                            <input type="time" th:field="*{startTime}" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">End Time *</label>
                            <input type="time" th:field="*{endTime}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Max Patients Limit *</label>
                            <input type="number" th:field="*{maxPatients}" class="form-control" required min="1" max="50">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Consultation Fee (LKR) *</label>
                            <input type="number" step="0.01" th:field="*{consultationFee}" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">Publish Schedule Session</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
