<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - LankaCare E-Channeling">LankaCare E-Channeling</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; color: #0d6efd !important; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn-primary { background-color: #0d6efd; border: none; }
        footer { margin-top: 50px; padding: 20px 0; background: #ffffff; border-top: 1px solid #e9ecef; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div th:replace="~{fragments/nav :: nav}"></div>

    <!-- Alert Messages -->
    <div class="container mt-3">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
    </div>

    <!-- Main Content Area -->
    <main class="container my-4">
        <div layout:fragment="content">
            <!-- Dynamic Page Content Insertion -->
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
