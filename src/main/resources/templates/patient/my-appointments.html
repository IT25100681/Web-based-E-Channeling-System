<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>My Appointments</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-calendar-check text-primary me-2"></i>My Channeling Appointments</h2>
        <a href="/patient/appointments/search" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> Book New Session</a>
    </div>

    <div class="card p-4 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Reference</th>
                    <th>Doctor Name</th>
                    <th>Specialization</th>
                    <th>Date & Time</th>
                    <th>Status</th>
                    <th>Fee</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td class="fw-bold" th:text="${a.referenceNo}">APP-123</td>
                    <td th:text="${a.doctorName}">Doctor</td>
                    <td th:text="${a.specialization}">Spec</td>
                    <td th:text="${a.appointmentDate} + ' ' + ${a.appointmentTime}">Date</td>
                    <td>
                        <span th:if="${a.status.name() == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                        <span th:if="${a.status.name() == 'CONFIRMED'}" class="badge bg-success">CONFIRMED</span>
                        <span th:if="${a.status.name() == 'COMPLETED'}" class="badge bg-primary">COMPLETED</span>
                        <span th:if="${a.status.name() == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
                    </td>
                    <td th:text="'LKR ' + ${a.fee}">Fee</td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:if="${a.status.name() == 'COMPLETED'}" th:href="@{/prescriptions/appointment/{id}(id=${a.appointmentId})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-prescription-bottle-medical me-1"></i> Rx</a>
                            <a th:if="${a.paymentStatus == 'PAID'}" th:href="@{/patient/payments/receipt/{id}(id=${a.appointmentId})}" class="btn btn-sm btn-outline-success">Receipt</a>
                            <form th:if="${a.status.name() == 'PENDING' || a.status.name() == 'CONFIRMED'}" th:action="@{/patient/appointments/{id}/cancel(id=${a.appointmentId})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to cancel this appointment?')">Cancel</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="7" class="text-center text-muted py-4">No appointments found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
