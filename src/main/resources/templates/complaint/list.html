<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>Complaints Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-comments text-primary me-2"></i>Patient Complaints Management</h2>
        <a sec:authorize="hasRole('PATIENT')" href="/complaints/new" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> Submit New Complaint</a>
    </div>

    <div class="card p-4 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Ticket ID</th>
                    <th>Category</th>
                    <th>Title</th>
                    <th>Patient Name</th>
                    <th>Status</th>
                    <th>Submitted Date</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${complaints}">
                    <td class="fw-bold" th:text="'#CMP-' + ${c.complaintId}">CMP-1</td>
                    <td th:text="${c.category.name}">Category</td>
                    <td th:text="${c.title}" class="fw-bold">Title</td>
                    <td th:text="${c.patient.name}">Patient</td>
                    <td>
                        <span th:if="${c.status.name() == 'SUBMITTED'}" class="badge bg-warning text-dark">SUBMITTED</span>
                        <span th:if="${c.status.name() == 'ASSIGNED'}" class="badge bg-info">ASSIGNED</span>
                        <span th:if="${c.status.name() == 'IN_PROGRESS'}" class="badge bg-primary">IN PROGRESS</span>
                        <span th:if="${c.status.name() == 'RESOLVED'}" class="badge bg-success">RESOLVED</span>
                        <span th:if="${c.status.name() == 'CLOSED'}" class="badge bg-secondary">CLOSED</span>
                    </td>
                    <td th:text="${c.createdAt}">Date</td>
                    <td>
                        <form sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')" th:action="@{/complaints/{id}/status(id=${c.complaintId})}" method="post" class="d-flex gap-1">
                            <select name="status" class="form-select form-select-sm" style="width: auto;">
                                <option value="ASSIGNED" th:selected="${c.status.name() == 'ASSIGNED'}">Assign</option>
                                <option value="IN_PROGRESS" th:selected="${c.status.name() == 'IN_PROGRESS'}">In Progress</option>
                                <option value="RESOLVED" th:selected="${c.status.name() == 'RESOLVED'}">Resolve</option>
                                <option value="CLOSED" th:selected="${c.status.name() == 'CLOSED'}">Close</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(complaints)}">
                    <td colspan="7" class="text-center text-muted py-4">No complaint records found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
