<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Payment Receipt</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow text-center">
                <i class="fa-solid fa-circle-check fa-4x text-success mb-3"></i>
                <h3 class="fw-bold text-success">Payment Successful!</h3>
                <p class="text-muted">Your channeling appointment has been officially confirmed.</p>

                <div class="border text-start p-3 rounded my-3 bg-light">
                    <h5 class="fw-bold mb-3 border-bottom pb-2">Digital Payment Receipt</h5>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Transaction Ref:</div>
                        <div class="col-6 fw-bold text-end" th:text="${payment.transactionRef}">TXN-123</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Appointment Ref:</div>
                        <div class="col-6 text-end" th:text="${payment.appointment.referenceNo}">APP-123</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Doctor Name:</div>
                        <div class="col-6 text-end" th:text="${payment.appointment.doctor.name}">Dr. Name</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Date & Time:</div>
                        <div class="col-6 text-end" th:text="${payment.appointment.appointmentDate} + ' @ ' + ${payment.appointment.appointmentTime}">Date</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Payment Status:</div>
                        <div class="col-6 text-end"><span class="badge bg-success" th:text="${payment.paymentStatus}">PAID</span></div>
                    </div>
                    <div class="row pt-2 border-top">
                        <div class="col-6 fw-bold fs-5">Total Paid:</div>
                        <div class="col-6 fw-bold fs-5 text-success text-end" th:text="'LKR ' + ${payment.amount}">LKR 2000</div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button onclick="window.print()" class="btn btn-outline-secondary flex-fill"><i class="fa-solid fa-print me-1"></i> Print Receipt</button>
                    <a href="/patient/appointments" class="btn btn-primary flex-fill">Go to My Appointments</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
