<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Payment Gateway</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">
                <div class="text-center mb-3">
                    <i class="fa-solid fa-credit-card fa-3x text-primary mb-2"></i>
                    <h4 class="fw-bold">Secure Payment Checkout</h4>
                    <p class="text-muted small">Mock Payment Gateway for Channeling</p>
                </div>
                <div class="bg-light p-3 rounded mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Reference:</span>
                        <strong th:text="${appointment.referenceNo}">APP-123</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Doctor:</span>
                        <strong th:text="${appointment.doctorName}">Dr. Name</strong>
                    </div>
                    <div class="d-flex justify-content-between mt-2 pt-2 border-top">
                        <span class="fs-5">Amount Due:</span>
                        <strong class="fs-5 text-success" th:text="'LKR ' + ${appointment.fee}">LKR 2000</strong>
                    </div>
                </div>

                <form id="paymentForm" th:action="@{/patient/payments/process}" th:object="${paymentRequest}" method="post" novalidate>
                    <input type="hidden" th:field="*{appointmentId}">
                    <input type="hidden" th:field="*{amount}">
                    <input type="hidden" th:field="*{paymentMethod}">

                    <div class="mb-3">
                        <label class="form-label">Cardholder Name</label>
                        <input type="text" class="form-control" placeholder="Name on Card" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" th:field="*{cardNumber}" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19" required>
                        <div id="cardNumberError" class="invalid-feedback">Card number must contain exactly 16 digits.</div>
                        <small class="text-muted">Use any test card number. Card ending in '0000' will simulate failure.</small>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Expiry Date</label>
                            <input type="text" th:field="*{cardExpiry}" id="cardExpiry" class="form-control" placeholder="MM/YY" maxlength="5" required>
                            <div id="cardExpiryError" class="invalid-feedback">Expiry date is required.</div>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">CVV</label>
                            <input type="password" th:field="*{cvv}" class="form-control" placeholder="123" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold"><i class="fa-solid fa-lock me-1"></i> Pay Now & Confirm</button>
                </form>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const cardNumberInput = document.getElementById('cardNumber');
        const cardNumberError = document.getElementById('cardNumberError');
        const cardExpiryInput = document.getElementById('cardExpiry');
        const cardExpiryError = document.getElementById('cardExpiryError');
        const paymentForm = document.getElementById('paymentForm');

        // ==========================================
        // 1. CARD NUMBER LOGIC
        // ==========================================
        function formatCardNumber(preferredCaretPos) {
            if (!cardNumberInput) return;
            try {
                let currentVal = cardNumberInput.value || '';
                let isFocused = (document.activeElement === cardNumberInput);
                let cursorPos = isFocused ? ((typeof preferredCaretPos === 'number') ? preferredCaretPos : cardNumberInput.selectionStart) : null;

                let digitsBeforeCursor = 0;
                if (cursorPos !== null && cursorPos !== undefined) {
                    for (let i = 0; i < Math.min(cursorPos, currentVal.length); i++) {
                        if (/[0-9]/.test(currentVal[i])) {
                            digitsBeforeCursor++;
                        }
                    }
                }

                let rawDigits = currentVal.replace(/[^0-9]/g, '');
                if (rawDigits.length > 16) {
                    rawDigits = rawDigits.substring(0, 16);
                }

                let formatted = '';
                for (let i = 0; i < rawDigits.length; i++) {
                    if (i > 0 && i % 4 === 0) {
                        formatted += ' ';
                    }
                    formatted += rawDigits[i];
                }

                if (cardNumberInput.value !== formatted) {
                    cardNumberInput.value = formatted;
                }

                if (isFocused && cursorPos !== null && cursorPos !== undefined && typeof cardNumberInput.setSelectionRange === 'function') {
                    let newCursorPos = 0;
                    let digitsSeen = 0;
                    for (let i = 0; i < formatted.length; i++) {
                        if (digitsSeen === digitsBeforeCursor) {
                            if (formatted[i] === ' ') {
                                newCursorPos = i + 1;
                            } else {
                                newCursorPos = i;
                            }
                            break;
                        }
                        if (/[0-9]/.test(formatted[i])) {
                            digitsSeen++;
                        }
                        newCursorPos = i + 1;
                    }
                    try {
                        cardNumberInput.setSelectionRange(newCursorPos, newCursorPos);
                    } catch (e) {}
                }
            } catch (err) {
                console.error('Error formatting card number:', err);
            }
        }

        function validateCardNumber() {
            if (!cardNumberInput) return true;
            let rawDigits = (cardNumberInput.value || '').replace(/[^0-9]/g, '');
            if (rawDigits.length !== 16) {
                cardNumberInput.classList.add('is-invalid');
                if (cardNumberError) {
                    cardNumberError.style.display = 'block';
                }
                return false;
            } else {
                cardNumberInput.classList.remove('is-invalid');
                if (cardNumberError) {
                    cardNumberError.style.display = 'none';
                }
                return true;
            }
        }

        if (cardNumberInput) {
            formatCardNumber();

            cardNumberInput.addEventListener('keydown', function (e) {
                const allowedKeys = [
                    'Backspace', 'Delete', 'Tab', 'Escape', 'Enter',
                    'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                    'Home', 'End'
                ];

                if (allowedKeys.includes(e.key) || e.ctrlKey || e.metaKey) {
                    if (e.key === 'Backspace' && cardNumberInput.selectionStart === cardNumberInput.selectionEnd) {
                        const pos = cardNumberInput.selectionStart;
                        if (pos > 1 && cardNumberInput.value[pos - 1] === ' ') {
                            e.preventDefault();
                            let val = cardNumberInput.value;
                            cardNumberInput.value = val.substring(0, pos - 2) + val.substring(pos);
                            formatCardNumber(pos - 2);
                            let rawDigits = cardNumberInput.value.replace(/[^0-9]/g, '');
                            if (cardNumberInput.classList.contains('is-invalid') || rawDigits.length === 16) {
                                validateCardNumber();
                            }
                            return;
                        }
                    }
                    if (e.key === 'Delete' && cardNumberInput.selectionStart === cardNumberInput.selectionEnd) {
                        const pos = cardNumberInput.selectionStart;
                        if (pos < cardNumberInput.value.length && cardNumberInput.value[pos] === ' ') {
                            e.preventDefault();
                            let val = cardNumberInput.value;
                            cardNumberInput.value = val.substring(0, pos) + val.substring(pos + 2);
                            formatCardNumber(pos);
                            let rawDigits = cardNumberInput.value.replace(/[^0-9]/g, '');
                            if (cardNumberInput.classList.contains('is-invalid') || rawDigits.length === 16) {
                                validateCardNumber();
                            }
                            return;
                        }
                    }
                    return;
                }

                if (!/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                    return;
                }

                let rawDigits = (cardNumberInput.value || '').replace(/[^0-9]/g, '');
                if (rawDigits.length >= 16 && cardNumberInput.selectionStart === cardNumberInput.selectionEnd) {
                    e.preventDefault();
                    return;
                }
            });

            cardNumberInput.addEventListener('input', function () {
                formatCardNumber();
                let rawDigits = (cardNumberInput.value || '').replace(/[^0-9]/g, '');
                if (cardNumberInput.classList.contains('is-invalid') || rawDigits.length === 16) {
                    validateCardNumber();
                }
            });

            cardNumberInput.addEventListener('blur', function () {
                formatCardNumber();
                validateCardNumber();
            });
        }

        // ==========================================
        // 2. CARD EXPIRY LOGIC (MM/YY)
        // ==========================================
        function formatCardExpiry(preferredCaretPos) {
            if (!cardExpiryInput) return;
            try {
                let currentVal = cardExpiryInput.value || '';
                let isFocused = (document.activeElement === cardExpiryInput);
                let cursorPos = isFocused ? ((typeof preferredCaretPos === 'number') ? preferredCaretPos : cardExpiryInput.selectionStart) : null;

                // Remove non-digit characters and limit to 4 digits (MMYY)
                let digits = currentVal.replace(/[^0-9]/g, '').substring(0, 4);

                let formatted = '';
                if (digits.length >= 2) {
                    formatted = digits.substring(0, 2) + '/' + digits.substring(2);
                } else {
                    formatted = digits;
                }

                if (cardExpiryInput.value !== formatted) {
                    cardExpiryInput.value = formatted;
                }

                if (isFocused && cursorPos !== null && cursorPos !== undefined && typeof cardExpiryInput.setSelectionRange === 'function') {
                    let newPos = cursorPos;
                    if (digits.length === 2 && currentVal.length === 2 && formatted.length === 3) {
                        newPos = 3;
                    }
                    try {
                        cardExpiryInput.setSelectionRange(newPos, newPos);
                    } catch (e) {}
                }
            } catch (err) {
                console.error('Error formatting card expiry:', err);
            }
        }

        function validateCardExpiry() {
            if (!cardExpiryInput) return true;

            let val = (cardExpiryInput.value || '').trim();

            // 1. Required field validation
            if (val === '') {
                cardExpiryInput.classList.add('is-invalid');
                if (cardExpiryError) {
                    cardExpiryError.textContent = 'Expiry date is required.';
                    cardExpiryError.style.display = 'block';
                }
                return false;
            }

            // 2. Format validation (MM/YY)
            if (val.length !== 5 || val.charAt(2) !== '/') {
                cardExpiryInput.classList.add('is-invalid');
                if (cardExpiryError) {
                    cardExpiryError.textContent = 'Invalid expiry date format (MM/YY).';
                    cardExpiryError.style.display = 'block';
                }
                return false;
            }

            // Extract month and year
            let month = parseInt(val.substring(0, 2), 10);
            let year = parseInt(val.substring(3, 5), 10);

            // 3. Month validation (01 to 12)
            if (isNaN(month) || month < 1 || month > 12) {
                cardExpiryInput.classList.add('is-invalid');
                if (cardExpiryError) {
                    cardExpiryError.textContent = 'Month must be between 01 and 12.';
                    cardExpiryError.style.display = 'block';
                }
                return false;
            }

            // 4. Date validation (compare with current month and year)
            let now = new Date();
            let currentYearYY = now.getFullYear() % 100; // e.g. 2026 -> 26
            let currentMonth = now.getMonth() + 1;       // 1 to 12

            if (isNaN(year) || year < currentYearYY || (year === currentYearYY && month < currentMonth)) {
                cardExpiryInput.classList.add('is-invalid');
                if (cardExpiryError) {
                    cardExpiryError.textContent = 'Card has expired.';
                    cardExpiryError.style.display = 'block';
                }
                return false;
            }

            // Valid expiry date!
            cardExpiryInput.classList.remove('is-invalid');
            if (cardExpiryError) {
                cardExpiryError.style.display = 'none';
            }
            return true;
        }

        if (cardExpiryInput) {
            formatCardExpiry();

            cardExpiryInput.addEventListener('keydown', function (e) {
                const allowedKeys = [
                    'Backspace', 'Delete', 'Tab', 'Escape', 'Enter',
                    'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                    'Home', 'End'
                ];

                if (allowedKeys.includes(e.key) || e.ctrlKey || e.metaKey) {
                    if (e.key === 'Backspace' && cardExpiryInput.selectionStart === 3 && cardExpiryInput.selectionEnd === 3) {
                        e.preventDefault();
                        let val = cardExpiryInput.value;
                        cardExpiryInput.value = val.substring(0, 1);
                        formatCardExpiry();
                        if (cardExpiryInput.classList.contains('is-invalid')) {
                            validateCardExpiry();
                        }
                        return;
                    }
                    return;
                }

                if (!/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                    return;
                }

                let rawDigits = (cardExpiryInput.value || '').replace(/[^0-9]/g, '');
                if (rawDigits.length >= 4 && cardExpiryInput.selectionStart === cardExpiryInput.selectionEnd) {
                    e.preventDefault();
                    return;
                }
            });

            cardExpiryInput.addEventListener('input', function () {
                formatCardExpiry();
                let val = cardExpiryInput.value;
                if (cardExpiryInput.classList.contains('is-invalid') || val.length === 5) {
                    validateCardExpiry();
                }
            });

            cardExpiryInput.addEventListener('blur', function () {
                formatCardExpiry();
                validateCardExpiry();
            });
        }

        // ==========================================
        // 3. FORM SUBMISSION LOGIC
        // ==========================================
        if (paymentForm) {
            paymentForm.addEventListener('submit', function (e) {
                formatCardNumber();
                formatCardExpiry();

                let isCardValid = validateCardNumber();
                let isExpiryValid = validateCardExpiry();

                if (!isCardValid || !isExpiryValid) {
                    e.preventDefault();
                    e.stopPropagation();

                    if (!isCardValid) {
                        cardNumberInput.focus();
                    } else if (!isExpiryValid) {
                        cardExpiryInput.focus();
                    }
                } else {
                    let rawDigits = (cardNumberInput.value || '').replace(/[^0-9]/g, '');
                    cardNumberInput.value = rawDigits;
                }
            });
        }
    });
    </script>
</div>
</body>
</html>
