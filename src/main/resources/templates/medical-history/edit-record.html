<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Edit Clinical Record</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4 shadow">
                <h3 class="fw-bold text-primary mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Clinical Record</h3>
                <p class="text-muted" th:text="'Patient: ' + ${patientName}">Patient Name</p>
                <form th:action="@{/medical-history/records/{id}(id=${recordId})}" th:object="${recordForm}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{patientId}">
                    <input type="hidden" th:field="*{doctorId}">
                    <input type="hidden" th:field="*{recordId}">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">Blood Group</label>
                            <input type="text" th:field="*{bloodGroup}" class="form-control" placeholder="e.g. O+">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">Chronic Conditions / Previous Illnesses</label>
                            <input type="text" th:field="*{chronicConditions}" class="form-control" placeholder="e.g. Diabetes Type II">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Diagnosis *</label>
                        <input type="text" th:field="*{diagnosis}" class="form-control" required placeholder="Primary Diagnosis">
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Treatment Notes & Observations</label>
                        <textarea th:field="*{treatmentNotes}" class="form-control" rows="4" placeholder="Enter treatment plan, notes, or observations..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label font-weight-bold">Attach Additional Lab Report / Medical Document</label>
                        <input type="file" name="file" class="form-control">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-2 fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Update Clinical Record</button>
                        <a th:href="@{/medical-history/patient/{id}(id=${recordForm.patientId})}" class="btn btn-secondary py-2 fw-bold">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
